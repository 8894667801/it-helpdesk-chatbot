<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk Chatbot — Smart Troubleshooting Assistant</title>
    <meta name="description" content="Smart IT Helpdesk Chatbot that guides you step-by-step to fix common Windows, Outlook, Microsoft 365, and system issues.">
    <meta property="og:title" content="IT Helpdesk Chatbot — Smart Troubleshooting Assistant">
    <meta property="og:description" content="Get step-by-step help fixing Outlook, Windows, Microsoft 365, AWS access, and more. No waiting — instant IT support.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://8894667801.github.io/it-helpdesk-chatbot/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="IT Helpdesk Chatbot">
    <meta name="twitter:description" content="Smart IT troubleshooting assistant — instant step-by-step help for common issues.">
    <meta name="theme-color" content="#0a0e17">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="bot-avatar-large">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 2a4 4 0 0 1 4 4v1h1a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3h1V6a4 4 0 0 1 4-4z"/>
                        <circle cx="9" cy="13" r="1.5" fill="currentColor" stroke="none"/>
                        <circle cx="15" cy="13" r="1.5" fill="currentColor" stroke="none"/>
                        <path d="M9 17h6" stroke-linecap="round"/>
                        <path d="M12 2V0M4 10H2M22 10h-2" stroke-linecap="round"/>
                    </svg>
                </div>
                <h1>IT Helpdesk</h1>
                <p class="sidebar-subtitle">Smart Troubleshooting Assistant</p>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section-title">Quick Topics</div>
                <button class="nav-item" data-category="outlook">
                    <span class="nav-icon">📧</span>
                    <span>Outlook Issues</span>
                </button>
                <button class="nav-item" data-category="windows">
                    <span class="nav-icon">🪟</span>
                    <span>Windows &amp; Cache</span>
                </button>
                <button class="nav-item" data-category="updates">
                    <span class="nav-icon">🔄</span>
                    <span>System Updates</span>
                </button>
                <button class="nav-item" data-category="m365">
                    <span class="nav-icon">☁️</span>
                    <span>Microsoft 365</span>
                </button>
                <button class="nav-item" data-category="health">
                    <span class="nav-icon">💻</span>
                    <span>Device Health</span>
                </button>
                <button class="nav-item" data-category="aws">
                    <span class="nav-icon">☁️</span>
                    <span>AWS Access</span>
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="new-chat-btn" id="newChatBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
                    New Conversation
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Header -->
            <header class="chat-header">
                <button class="menu-toggle" id="menuToggle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                        <path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round"/>
                    </svg>
                </button>
                <div class="header-info">
                    <div class="header-title">
                        <div class="status-dot online"></div>
                        <h2>IT Support Bot</h2>
                    </div>
                    <span class="header-status">Online — Ready to help</span>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="themeToggle" title="Toggle theme">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>
                    <button class="icon-btn" id="clearChat" title="Clear chat">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Messages -->
            <div class="messages-container" id="messagesContainer">
                <div class="messages-inner" id="messagesInner">
                    <!-- Messages will be injected here -->
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="userInput" placeholder="Describe your IT issue..." autocomplete="off">
                    <button class="send-btn" id="sendBtn" title="Send message">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
                <div class="input-hint">Press Enter to send · Type your issue in plain language</div>
            </div>
        </main>
    </div>

    <script src="knowledgeBase.js"></script>
    <script src="app.js"></script>
</body>
</html>
